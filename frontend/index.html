<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Speech Translation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <h1>AI Speech Translation</h1>

  <!-- INPUT TYPE -->
  <label>Input Capture</label>
  <select id="inputType">
    <option>Microphone</option>
    <option>Audio File</option>
    <option>Video File</option>
    <option>YouTube Link</option>
  </select>

  <input type="file" id="fileInput" />

  <input type="text" id="youtubeLink" placeholder="Paste YouTube link" />

  <!-- LANGUAGES -->
  <label>Source Language</label>
  <select id="sourceLang">
    <option value="auto">Auto Detect</option>
    <option value="en">English</option>
    <option value="hi">Hindi</option>
  </select>

  <label>Target Language</label>
  <select id="targetLang">
  <option value="hi">Hindi</option>
  <option value="te">Telugu</option>
  <option value="ta">Tamil</option>
  <option value="kn">Kannada</option>
  <option value="ml">Malayalam</option>
  <option value="mr">Marathi</option>
  <option value="bn">Bengali</option>
  <option value="gu">Gujarati</option>
  <option value="pa">Punjabi</option>
  <option value="or">Odia</option>
  <option value="ur">Urdu</option>
  <option value="en">English</option>
  </select>

  <!-- ACTION -->
  <button onclick="translate()">Translate</button>

  <!-- OUTPUT -->
  <div class="output">
    <h3>Translated Text</h3>
    <textarea id="translatedText" readonly></textarea>

    <div class="buttons">
      <button onclick="copyText()">Copy Text</button>
      <button onclick="downloadText()">Download .txt</button>
    </div>

    <h3>Audio Output (TTS)</h3>
    <audio id="audioPlayer" controls></audio>
    <br>
    <a id="downloadAudio" download="output.mp3">
      <button>Download MP3</button>
    </a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
